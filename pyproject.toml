[project]
name = "hermes-buildkite"
version = "0.1.0"
description = "Buildkite signature translation for Hermes Agent"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["aiohttp>=3.12,<4"]

[project.entry-points."hermes_agent.plugins"]
hermes-buildkite = "hermes_buildkite"

[tool.hatch.build.targets.wheel]
packages = ["hermes_buildkite"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_buildkite/plugin.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
