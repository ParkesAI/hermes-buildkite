[project]
name = "hermes-buildkite"
version = "0.1.1"
description = "Buildkite signature translation for Hermes Agent"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ParkesAI contributors"}]
dependencies = ["aiohttp>=3.12,<4"]

[project.entry-points."hermes_agent.plugins"]
hermes-buildkite = "hermes_buildkite"

[tool.hatch.build.targets.wheel]
packages = ["hermes_buildkite"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_buildkite/plugin.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/ParkesAI/hermes-buildkite"
Issues = "https://github.com/ParkesAI/hermes-buildkite/issues"

[dependency-groups]
dev = ["ruff>=0.14,<0.15", "pyyaml>=6,<7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.sdist]
include = ["hermes_buildkite", "tests", "scripts", "docs", "uv.lock", "plugin.yaml", "__init__.py", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md"]
